apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-pharma-valentine
  namespace: cp-gt
  labels:
    app: cp-pharma-valentine
annotations:
spec:
  selector:
    matchLabels:
      app: cp-pharma-valentine
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cp-pharma-valentine
    spec:
      containers:
        - name: cp-pharma-valentine
          image: us-docker.pkg.dev/clinicpesa-1/gcr.io/cp-pharma-valentine:20251201001-valentine
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
              cpu: "500m"
